# Ligues couvertes et compétitions servant à identifier leur force relative.
#
# `leagues` doit rester synchronisé avec l'énumération LeagueId de schemas/common.schema.json ;
# un test le vérifie. Ajouter une ligue se fait aux deux endroits, et nulle part ailleurs.

period:
  first_season: 2019

# Source des performances joueur-game.
#
#   oracle       CSV annuels d'Oracle's Elixir — source de référence du brief, mais
#                distribuée par Google Drive dont le quota public s'épuise.
#   leaguepedia  tableaux de score, par la même API Cargo que les contrats. Vrais pseudos
#                et vraies équipes, mais pas de différentiels de lane à 15 minutes : trois
#                des huit composants de metric_std disparaissent alors, et meta.json
#                enregistre lesquels ont réellement servi.
performance_source: leaguepedia

leagues:
  - id: LEC
    label: "LEC"
    tier: 1
    region: EMEA
    oracle_codes: ["LEC"]
    leaguepedia_page: "LEC"

  - id: LFL
    label: "LFL"
    tier: 2
    region: EMEA
    oracle_codes: ["LFL"]
    leaguepedia_page: "LFL"

# Rencontres internationales : elles ne sont pas exportées comme ligues, elles servent de
# seconde source d'identification de l'effet de ligue (§4.1).
international_events:
  - id: WLDs
    label: "Worlds"
    oracle_codes: ["WLDs"]
  - id: MSI
    label: "MSI"
    oracle_codes: ["MSI"]
  - id: EM
    label: "EMEA Masters"
    oracle_codes: ["EM", "EM EU"]

reliability:
  high_min_games: 60
  medium_min_games: 25
  low_min_games: 10

# Le pipeline s'arrête au-delà de ce taux d'entités non résolues (§3.2).
max_unmatched_rate: 0.02

# Sources de téléchargement d'Oracle's Elixir.
#
# Les fichiers annuels sont distribués via Google Drive, un identifiant par année. Le bucket
# S3 historique n'existe plus. Ces identifiants sont de la configuration : s'ils changent,
# c'est ici qu'on les corrige, et le pipeline échoue bruyamment plutôt que d'exporter un
# jeu de données amputé d'une saison.
oracle_downloads:
  base_url: "https://drive.google.com/uc?export=download&id="
  files:
    2019: "11eKtScnZcpfZcD3w3UrD7nnpfLHvj9_t"
    2020: "1dlSIczXShnv1vIfGNvBjgk-thMKA5j7d"
    2021: "1fzwTTz77hcnYjOnO9ONeoPrkWCoOSecA"
    2022: "1EHmptHyzY8owv0BAcNKtkQpMwfkURwRy"
    2023: "1XXk2LO0CsNADBB1LRGOV5rUpyZdEZ8s2"
    2024: "1IjIEhLc9n8eLKeY-yh_YigKVWbhgGBsN"
    2025: "1v6LRphp2kYciU4SXp0PCjEMuev1bDejc"
