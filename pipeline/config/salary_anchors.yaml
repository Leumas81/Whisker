# Ancres salariales — §3.1C et §4.5 du brief.
#
# Aucune de ces valeurs n'est codée en dur dans un script. Chacune porte sa source, son URL
# et sa date de relevé, et se retrouve telle quelle dans salary.json, donc affichable.
#
# Nature des sources, à ne pas perdre de vue : aucun club ne publie ses salaires. Les
# chiffres LEC viennent d'une enquête journalistique adossée à des sources confidentielles,
# pas d'une divulgation officielle. Le plancher LEC et le plafond LFL, eux, sont
# réglementaires et donc factuels.

confidence_level: 0.8

anchors:
  # ── LEC ──────────────────────────────────────────────────────────────────────────────
  - id: lec-moyenne-2025
    league: LEC
    season: 2025
    statistic: mean
    value: 240000
    currency: EUR
    uncertainty: 20000
    source: "Sheep Esports — enquête « Everything about LEC salaries unveiled », par LEC Wooloo"
    method: >-
      Rémunérations des 50 joueurs actifs de LEC sur les splits Summer 2024 et Winter 2025,
      recoupées auprès de sources confidentielles. L'auteur annonce une précision de
      ± 20 000 € dans plus de 95 % des cas. Ce n'est pas une divulgation officielle.
    url: "https://www.sheepesports.com/en/all/articles/exclusive-everything-about-lec-salaries-unveiled-or-lec-wooloo/en"
    retrieved_at: "2026-08-21"
    published_at: "2025-01-20"

  - id: lec-mediane-2025
    league: LEC
    season: 2025
    statistic: median
    value: 165000
    currency: EUR
    uncertainty: 10000
    source: "Sheep Esports — enquête « Everything about LEC salaries unveiled », par LEC Wooloo"
    method: "Médiane des mêmes 50 joueurs, split Winter 2025. Annoncée à ± 10 000 €."
    url: "https://www.sheepesports.com/en/all/articles/exclusive-everything-about-lec-salaries-unveiled-or-lec-wooloo/en"
    retrieved_at: "2026-08-21"
    published_at: "2025-01-20"

  - id: lec-plancher-2025
    league: LEC
    season: 2025
    statistic: floor
    value: 60000
    currency: EUR
    uncertainty: 0
    source: "Règlement LEC de Riot Games — salaire minimum annuel"
    method: >-
      Valeur réglementaire, pas une estimation. Le règlement fixe un minimum de 1 000 €
      bruts mensuels, majoré de 1 000 € par semaine de match disputée, ce que les reprises
      de presse résument par un plancher annuel de 60 000 €.
    url: "https://esports-news.co.uk/2023/09/28/lec-salary-cap-financial-regulations/"
    retrieved_at: "2026-08-21"
    published_at: "2023-09-28"

  # ── LFL ──────────────────────────────────────────────────────────────────────────────
  # La LFL ne dispose d'aucune enquête équivalente. Ce qui existe est rassemblé ici, et ne
  # suffit pas à identifier une distribution : voir `distributions` plus bas.
  - id: lfl-plafond-2025
    league: LFL
    season: 2025
    statistic: roster_cap
    value: 250000
    currency: EUR
    uncertainty: 0
    source: "LFL — Règlement Financier Sportif, saison 2025"
    method: >-
      Plafond réglementaire portant sur la somme des cinq salaires les plus élevés d'une
      équipe. Il borne donc la moyenne LFL à 50 000 € par joueur titulaire, sans dire où
      elle se situe réellement sous ce plafond. Projeté à 300 000 € en 2027.
    url: "https://www.team-aaa.com/fr/actualite/la-lfl-lance-le-reglement-financier-sportif-pour-la-saison-2025_133129"
    retrieved_at: "2026-08-21"
    published_at: "2024-11-26"

  - id: lfl-fourchette-2022
    league: LFL
    season: 2022
    statistic: range
    value_lower: 16500
    value_upper: 132000
    currency: EUR
    source: "Millenium — d'après L'Apéritif de Solary (Paul Arrivé, L'Équipe ; Lounet, AEGIS)"
    method: >-
      Déclarations en plateau : 1 500 €/mois pour un rookie, 3 500 à 4 000 € après deux ou
      trois ans, 10 000 à 12 000 € pour le haut du panier, sur onze mois payés (décembre
      étant le mercato). Annualisé ici. Antérieur de trois ans au plafond salarial, donc
      décrivant un marché qui n'existe plus sous cette forme.
    url: "https://www.millenium.org/news/397442.html"
    retrieved_at: "2026-08-21"
    published_at: "2022-11-23"

# ── Ce qu'on accepte de publier ────────────────────────────────────────────────────────
#
# Une distribution n'est calibrée que si la ligue dispose d'au moins deux moments
# indépendants relevés sur la même période. C'est la règle, et elle est appliquée par le
# code, pas seulement énoncée ici.

distributions:
  - league: LEC
    season: 2025
    publish: true
    basis: observed
    moments: [lec-moyenne-2025, lec-mediane-2025]
    floor: lec-plancher-2025
    note: >-
      Moyenne et médiane relevées sur la même enquête et la même période. La log-normale
      simple qu'elles impliquent place 12,1 % des joueurs sous le plancher réglementaire de
      60 000 €, ce qui est impossible : la loi est donc tronquée à gauche et ré-identifiée
      numériquement, conformément au §4.5.

  - league: LFL
    season: 2025
    publish: false
    basis: insufficient
    moments: []
    note: >-
      Rien à calibrer. Le plafond réglementaire majore la moyenne sans la situer, et la
      seule fourchette disponible date de 2022, avant l'entrée en vigueur de ce plafond.
      Deux bornes prises à trois ans d'écart ne font pas une distribution. Les joueurs de
      LFL sortent donc du pipeline sans quintile ni fourchette salariale, et le site le dit
      plutôt que de meubler.

# ── Contrôles de cohérence, vérifiés par les tests ─────────────────────────────────────
# Moyennes par poste publiées dans la même enquête. Elles ne servent pas à la calibration :
# elles servent à vérifier qu'elle est plausible une fois faite.
role_means_check:
  league: LEC
  season: 2025
  source: "Sheep Esports — même enquête"
  values:
    mid: 345000
    jng: 250000
    adc: 240000
    top: 192000
    sup: 168000
  rookie_mean: 115000
