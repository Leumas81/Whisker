name: verify

# La commande unique du §0.2, rejouée à chaque poussée. Ce qui passe ici passe partout :
# c'est le même `pnpm verify` que sur la machine de développement.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Site et contrats de données
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer Chromium
        run: pnpm --filter whisker-web exec playwright install --with-deps chromium

      - name: Vérifier
        run: pnpm verify

      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: web/playwright-report/
          retention-days: 7

  pipeline:
    name: Pipeline R
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: pipeline

      - name: Tests du pipeline
        working-directory: pipeline
        run: Rscript tests/testthat.R
