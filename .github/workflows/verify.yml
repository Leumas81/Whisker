name: verify

# La commande unique du §0.2, rejouée à chaque poussée. Ce qui passe ici passe partout :
# c'est le même `pnpm verify` que sur la machine de développement.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Site et contrats de données
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer Chromium
        run: pnpm --filter whisker-web exec playwright install --with-deps chromium

      - name: Vérifier
        run: pnpm verify

      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: web/playwright-report/
          retention-days: 7

  pipeline:
    name: Pipeline R
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      # V8, dont dépend jsonvalidate, ne s'installe pas sans cette bibliothèque système.
      # Sans elle, c'est toute la validation du contrat de données qui tombe.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnode-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Cache de la bibliothèque R
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-${{ runner.os }}-${{ hashFiles('pipeline/renv.lock') }}
          restore-keys: renv-${{ runner.os }}-

      # Voir .github/workflows/_r-setup.md pour le détail. En deux mots : le lockfile déclare
      # un dépôt de sources, ce qui ferait compiler arrow et lme4 sur le runner. On force
      # renv à utiliser celui que setup-r a configuré, qui sert des binaires.
      - name: Restaurer l'environnement R
        working-directory: pipeline
        run: |
          # Le dépôt binaire se déduit de la distribution du runner, sans passer par R : lire
          # la configuration de setup-r depuis R dépendait du nom qu'il donne à son dépôt, et
          # une clé absente faisait échouer l'étape en une seconde.
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          REPO="https://packagemanager.posit.co/cran/__linux__/${CODENAME}/latest"
          echo "distribution : $CODENAME"
          echo "dépôt        : $REPO"

          # renv est installé explicitement avant que le profil du projet ne tente de le faire
          # depuis le dépôt du lockfile, qui ne sert que des sources.
          R_PROFILE_USER=/dev/null Rscript -e "install.packages('renv', repos = '$REPO')"

          export RENV_CONFIG_REPOS_OVERRIDE="$REPO"
          Rscript -e 'renv::restore(prompt = FALSE)'
          Rscript -e 'cat("paquets restaurés :", nrow(installed.packages()), "\n")'

      - name: Tests du pipeline
        working-directory: pipeline
        run: Rscript tests/testthat.R
